services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      # Overrides for container networking — everything else (FreeLLMAPI
      # key/model, JWT_SECRET_KEY, etc.) still comes from backend/.env above.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: nexuslocal
      POSTGRES_DSN: postgresql://nexus:nexuslocal@postgres:5432/nexus
      # FreeLLMAPI runs natively on the host, not in this compose network;
      # host.docker.internal is Docker's DNS name for the host machine.
      # Keep the same path suffix your backend/.env already uses after the
      # port (e.g. /v1) if it differs from this default.
      # Port 11434 is Ollama's default — 3001 was Grafana's port (see the
      # grafana service below), so every AI call was silently hitting
      # Grafana's login redirect instead of the LLM.
      FREELLMAPI_BASE_URL: http://host.docker.internal:11434/v1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - neo4j
      - postgres
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/nexuslocal
    volumes:
      - neo4j_data:/data

  # Backs the users table (auth.py) for the login wall; catalog.py's
  # dataset metadata still lives in SQLite, not here.
  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuslocal
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      # Host port moved off 9090 — an unrelated project's container
      # ("cybersentinel-control-plane") already holds that port on this
      # machine, which was silently keeping this service from starting at
      # all. Container-internal port is still 9090 (unaffected).
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      # Same reason as Prometheus above — 3001 was already taken.
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: nexuslocal
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # V9: real-time streaming ingestion. Single-node KRaft mode (no separate
  # Zookeeper needed) — this is a genuine Kafka broker the backend's
  # producer/consumer talk to over the real wire protocol, just sized for
  # a local dev stack rather than a multi-broker cluster. Official Apache
  # Kafka image (bitnami/kafka:3.9 was pulled from Docker Hub).
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  neo4j_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  kafka_data:
