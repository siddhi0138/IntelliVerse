name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # All 52 tests run against in-memory pandas DataFrames (see
      # tests/conftest.py) and never import catalog.py/auth.py/main.py, so
      # no POSTGRES_DSN, JWT_SECRET_KEY, or any external service is needed
      # here - confirmed by running the suite with those env vars unset.
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build typechecks the whole project as part of the build step -
      # no separate `tsc --noEmit` needed. NEXT_PUBLIC_API_BASE is
      # intentionally left unset here: this build is a typecheck/compile
      # sanity check, not a deployable artifact, so it falls back to the
      # dev default (see lib/api.ts) rather than needing a real backend URL.
      - name: Build
        run: npm run build
