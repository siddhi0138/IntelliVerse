name: Backend keep-alive

on:
  schedule:
    # Every 10 minutes, 06:00-23:59 UTC. GitHub Actions schedules on a
    # public repo are unmetered, and unlike cron-job.org's pinger (which
    # was intermittently getting flagged as bot traffic and auto-disabling
    # itself after a failure streak), a failed run here never turns the
    # schedule off - it just shows red in the Actions tab.
    - cron: "*/10 6-23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          URL="https://intelliverse-ci8c.onrender.com/api/health"
          # This backend's cold start (heavier deps than a bare FastAPI
          # app) has been observed to outlast a single 90s request. First
          # attempt just kicks the container awake - its own
          # success/failure is ignored - then a second attempt against the
          # now-warm process is the one that actually has to succeed.
          curl --silent --max-time 90 -H "User-Agent: $UA" "$URL" || true
          curl --fail --silent --show-error --max-time 60 -H "User-Agent: $UA" "$URL"
